title = "FIXO secret scanning"

# Start from the maintained default ruleset, then add FIXO-specific patterns.
[extend]
useDefault = true

[[rules]]
id = "swalasms-live-key"
description = "SwalaSMS live API key"
regex = '''swl_live_[A-Za-z0-9]{16,}'''
tags = ["sms", "credential", "critical"]

[[rules]]
id = "swalasms-test-key"
description = "SwalaSMS sandbox API key"
regex = '''swl_test_[A-Za-z0-9]{16,}'''
tags = ["sms", "credential"]

[[rules]]
id = "fixo-webhook-secret-assignment"
description = "Webhook signing secret assigned inline"
regex = '''(?i)(webhook[_-]?secret|signing[_-]?secret)\s*[:=]\s*["\']?[A-Za-z0-9/+=_-]{16,}'''
tags = ["webhook", "credential", "critical"]

[[rules]]
id = "fixo-db-url-with-password"
description = "Database URL containing an inline password"
regex = '''(?i)(postgres|postgresql|mysql|redis)://[^:\s]+:[^@\s]{6,}@'''
tags = ["database", "credential", "critical"]

# Allowlist: documentation placeholders and illustrative patterns only. Never a real value.
[allowlist]
description = "Placeholders, fixtures and documentation"
paths = [
  '''(.*?)(\.env\.example)$''',
  '''^applications/backend/docs/''',
  '''^security/semgrep/''',
  '''^applications/backend/tests/security/''',
]
regexes = [
  '''swl_(live|test)_YOUR_API_KEY''',
  '''swl_(live|test)_(x|X){8,}''',
  '''swl_test_XXXXXXXXXXXXXXXX''',
  '''CHANGE_ME''',
  '''ci-fake-webhook-secret''',
]
