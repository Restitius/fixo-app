# .pre-commit-config.yaml
#
# Local hooks — fast feedback before a commit, optional/bypassable, catches
# the mistake before it becomes a commit (see security.yml for the
# authoritative, non-bypassable CI-side scan of the same things).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: <pin-to-tag>
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: <pin-to-tag>
    hooks:
      - id: ruff
        args: [--fix]
        files: ^applications/backend/
      - id: ruff-format
        files: ^applications/backend/
