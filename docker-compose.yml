# =============================================================================
# FIXO-APP — whole-application container stack.
#
# One compose PROJECT named FIXO-APP so Docker Desktop groups every service of
# this application together. It covers the backend (FastAPI), the customer-
# facing web frontend (TanStack Start / React), our own PostgreSQL and Redis —
# each in its own container, fully isolated from any other project on this
# machine. The provider-facing web app (applications/frontend/web/web-provider)
# has no service here yet — add one once it's scaffolded.
#
#   FIXO-APP
#   ├── fixo-postgres     :5434   our PostgreSQL (dedicated volume)
#   ├── fixo-redis        :6370   cache / queues
#   ├── fixo-api          :8000   FastAPI backend
#   └── fixo-web-user     :3000   customer-facing web frontend
# =============================================================================
name: FIXO-APP

services:
  postgres:
    image: postgres:16-alpine
    container_name: fixo-postgres
    restart: unless-stopped
    # Log the query ID and error, without the full failed SQL statement.
    # Query IDs can be 0 when parsing fails before PostgreSQL computes one.
    # Set POSTGRES_LOG_MIN_ERROR_STATEMENT=ERROR to include SQL for debugging.
    command:
      - postgres
      - -c
      - compute_query_id=on
      - -c
      - "log_line_prefix=%m [%p] query_id=%Q "
      - -c
      - "log_min_error_statement=${POSTGRES_LOG_MIN_ERROR_STATEMENT:-PANIC}"
    environment:
      POSTGRES_USER: fixo
      POSTGRES_PASSWORD: fixo_dev_password
      POSTGRES_DB: fixo
    ports:
      - "5434:5432"
    volumes:
      - fixo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixo -d fixo"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: fixo-redis
    restart: unless-stopped
    ports:
      - "6370:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: fixo-rabbitmq
    profiles: ["messaging"]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: fixo
      RABBITMQ_DEFAULT_PASS: fixo_dev_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - fixo_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.1
    container_name: fixo-kafka
    profiles: ["messaging"]
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
    volumes:
      - fixo_kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18

  api:
    build:
      context: ./applications/backend
      dockerfile: Dockerfile
    image: fixo-api:latest
    container_name: fixo-api
    restart: unless-stopped
    env_file:
      - ./applications/backend/.env
    environment:
      PRIMARY_DB_URL: postgresql+asyncpg://fixo:fixo_dev_password@postgres:5432/fixo
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8081,http://localhost:5190,http://localhost:5191,http://localhost:5192
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./applications/backend/storage:/srv/storage
      # Dev mounts — source changes are live on container restart (no rebuild).
      - ./applications/backend/app:/srv/app
      - ./applications/backend/migrations:/srv/migrations

  web-user:
    build:
      context: ./applications/frontend/web/web-user
      dockerfile: Dockerfile
    image: fixo-web-user:latest
    container_name: fixo-web-user
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"
    volumes:
      # Dev mounts — per-directory so TanStack's generated routeTree.gen.ts
      # (written to /app/src root) stays on the container filesystem.
      - ./applications/frontend/web/web-user/src/routes:/app/src/routes
      - ./applications/frontend/web/web-user/src/lib:/app/src/lib
      - ./applications/frontend/web/web-user/src/components:/app/src/components

volumes:
  fixo_pgdata:
  fixo_rabbitmq_data:
  fixo_kafka_data:
