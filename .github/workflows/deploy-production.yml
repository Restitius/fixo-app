# .github/workflows/deploy-production.yml
#
# Same signed-artifact contract as deploy-staging.yml, plus what production
# specifically needs: a required-reviewer approval gate (the `production`
# GitHub Environment — create it in repo Settings > Environments with
# required reviewers; that's the one manual setup step, mirrored from
# deploy-staging.yml's own "create the environment" note), a preflight
# check that staging actually passed for this exact commit, an
# expand-only migration gate, and automatic rollback if the new revision
# never becomes healthy.
#
# Same backend/frontend split as staging: backend is blue/green on
# whatever compute the user provisions (pending block below); web-user/
# web-provider are Cloudflare Workers, where "blue/green" is Cloudflare's
# own atomic deployment versioning — `wrangler rollback` is the real
# rollback mechanism for those two, not a container swap.
name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BACKEND_IMAGE: ghcr.io/restitius/fixo-backend

jobs:
  preflight:
    name: Preflight — staging passed for this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
      - name: Confirm this commit is on staging
        run: |
          git fetch origin staging --depth=200
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/staging; then
            echo "::error::Commit ${{ github.sha }} was never deployed through staging. Refusing to deploy to production directly." >&2
            exit 1
          fi

  verify-backend-image:
    name: Verify signed backend image
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.resolve.outputs.digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da   # v3.7.0
      - name: Resolve digest for this commit's tag
        id: resolve
        run: |
          digest=$(docker buildx imagetools inspect "${{ env.BACKEND_IMAGE }}:git-${{ github.sha }}" --format '{{json .Manifest}}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Verify signature (refuses anything build.yml didn't sign)
        run: scripts/verify-image.sh "${{ env.BACKEND_IMAGE }}@${{ steps.resolve.outputs.digest }}"

  verify-frontend-artifacts:
    name: Verify signed frontend artifact (${{ matrix.app }})
    needs: preflight
    strategy:
      matrix:
        app: [web-user, web-provider]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da   # v3.7.0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16   # v4.1.8
        with:
          name: ${{ matrix.app }}-git-${{ github.sha }}
          path: artifact
      - name: Verify signature and checksum
        working-directory: artifact
        run: |
          ../scripts/verify-frontend-artifact.sh \
            "${{ matrix.app }}-git-${{ github.sha }}.tar.gz" \
            "${{ matrix.app }}-git-${{ github.sha }}.tar.gz.sig" \
            "${{ matrix.app }}-git-${{ github.sha }}.tar.gz.pem"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
        with:
          name: ${{ matrix.app }}-verified-git-${{ github.sha }}
          retention-days: 1
          path: artifact/${{ matrix.app }}-git-${{ github.sha }}.tar.gz

  sms-key-guard:
    name: SMS key/environment guard
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
      - run: scripts/check-sms-key-env.sh production
        env:
          SWALA_SMS_API_KEY: ${{ secrets.PRODUCTION_SWALA_SMS_API_KEY }}
          SWALA_SMS_MODE: ${{ vars.PRODUCTION_SWALA_SMS_MODE }}

  migrate:
    name: Apply migrations (expand-only gate)
    needs: [verify-backend-image, sms-key-guard]
    runs-on: ubuntu-latest
    # Required reviewers on this Environment are the real approval gate —
    # create "production" under Settings > Environments with the on-call/
    # lead reviewers the handbook calls for. Every job below also targets
    # this Environment so none of them can run before that approval lands.
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b    # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install -r applications/backend/requirements.txt
      - name: Reject unsafe schema changes reaching production
        run: python scripts/check-migration-safety.py --base "origin/staging"
      - name: alembic upgrade head
        working-directory: applications/backend
        run: alembic upgrade head
        env:
          PRIMARY_DB_URL: ${{ secrets.PRODUCTION_PRIMARY_DB_URL }}

  deploy-backend:
    name: Deploy backend (production, blue/green)
    needs: [verify-backend-image, migrate]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683        # v4.2.2

      # --- PENDING: cloud provider / compute target not chosen yet --------
      # Same scope as deploy-staging.yml: I write the blue/green mechanics
      # (stand up "green" alongside "blue", verify, cut over, tear down
      # "blue"), the user supplies the real compute target and auth step.
      - name: Authenticate to cloud provider
        run: |
          echo "::warning::No cloud provider configured yet — add the auth step for your target here."
      - name: Stand up green revision (no traffic yet)
        run: |
          echo "::warning::Pending cloud provider choice. Once configured, deploy ${{ env.BACKEND_IMAGE }}@${{ needs.verify-backend-image.outputs.digest }} as 'green' alongside the current 'blue' revision, with 0% traffic."
      # ---------------------------------------------------------------------

      - name: Verify green is healthy before any traffic shifts
        run: scripts/post-deploy-verify.sh "${{ vars.PRODUCTION_GREEN_URL }}"

      # --- PENDING: same as above ------------------------------------------
      - name: Cut traffic over to green
        run: |
          echo "::warning::Pending cloud provider choice. Once configured, shift traffic from 'blue' to 'green' here (e.g. update the load balancer target group / traffic split)."
      # ---------------------------------------------------------------------

      - name: Verify production traffic is healthy post-cutover
        id: post_cutover
        run: scripts/post-deploy-verify.sh "${{ vars.PRODUCTION_BACKEND_URL }}"

      # --- PENDING: same as above ------------------------------------------
      - name: Automatic rollback — revert traffic to blue
        if: failure() && steps.post_cutover.outcome == 'failure'
        run: |
          echo "::error::Post-cutover health check failed. Reverting traffic to the 'blue' revision."
          echo "::warning::Pending cloud provider choice. Once configured, this step reverts the traffic split back to 'blue'."
      # ---------------------------------------------------------------------

      - name: Tear down blue (only after a healthy cutover)
        if: success()
        run: |
          echo "::warning::Pending cloud provider choice. Once configured, decommission the old 'blue' revision here."

  deploy-frontend:
    name: Deploy frontend (${{ matrix.app }}, production)
    needs: verify-frontend-artifacts
    strategy:
      matrix:
        include:
          - app: web-user
            smoke_url_var: PRODUCTION_WEB_USER_URL
          - app: web-provider
            smoke_url_var: PRODUCTION_WEB_PROVIDER_URL
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16   # v4.1.8
        with:
          name: ${{ matrix.app }}-verified-git-${{ github.sha }}
      - run: tar -xzf ${{ matrix.app }}-git-${{ github.sha }}.tar.gz -C .
      - name: wrangler deploy (Cloudflare Workers)
        id: deploy
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37   # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: deploy --config server/wrangler.json --env production
      - name: Smoke test
        id: smoke
        env:
          SMOKE_URL: ${{ vars[matrix.smoke_url_var] }}
        run: curl -fsS "$SMOKE_URL"
      - name: Automatic rollback (Cloudflare's own deployment versioning)
        if: failure() && steps.smoke.outcome == 'failure'
        uses: cloudflare/wrangler-action@392082e81ffbcb9ebdde27400634aa004b35ea37   # v3.14.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .
          command: >-
            rollback --config server/wrangler.json --env production
            --message "Auto-rollback - smoke test failed for git-${{ github.sha }}"
